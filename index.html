<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding:0}[hidden]{display:none!important}body{margin:0;font-size:14px}img{max-width:100%}</style></head><body><title>Genga Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Reggae+One&family=Shippori+Mincho:wght@400;700;800&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<style>/* Lightbox desk: the stage glows like an animator's light table, everything around it is a dim blue-grey desk.
   Keyframes are marked in red pencil, the playhead in blue pencil, the same two pencils anime key animators work with. */
:root{--desk:#191c26;--panel:#20242f;--raise:#2b3040;--line:#383e50;--ink:#e6e4dc;--mute:#9aa0b2;--glow:#ffd98c;--red:#ff6a5c;--blue:#57b6ff;--green:#6fd3a4;
 --ui:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;--disp:"Shippori Mincho","Noto Serif JP",serif;color-scheme:dark}
html,body{height:100%;background:var(--desk);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font:13px/1.35 var(--ui)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--raise);border:1px solid var(--line);border-radius:3px;padding:3px 9px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--mute)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--glow);color:#2a2110;border-color:var(--glow);font-weight:700}
button.tog.on{background:var(--glow);color:#2a2110;border-color:var(--glow)}
button.tog.rec.on{background:var(--red);border-color:var(--red);color:#2b0d0a}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
input,select,textarea{background:var(--desk);border:1px solid var(--line);border-radius:3px;padding:3px 5px;min-width:0}
input[type=color]{padding:0;width:30px;height:24px;background:none}
input[type=range]{padding:0;accent-color:var(--glow)}
#app{height:100%;display:grid;grid-template:"top top top" 44px "tools stage insp" minmax(0,1fr) "split split split" 5px "tl tl tl" var(--tlh,300px)/50px minmax(0,1fr) 300px}
#top{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
#brand{display:flex;align-items:baseline;gap:7px}
#brand .kanji{font:800 22px/1 var(--disp);color:var(--glow)}
#brand .nm{font-weight:700;letter-spacing:.04em}
#projName{width:190px;background:transparent;border-color:transparent}
#projName:hover,#projName:focus{border-color:var(--line)}
.chip{font:500 11px var(--mono);padding:2px 7px;border:1px dashed var(--glow);color:var(--glow);border-radius:9px;white-space:nowrap}
.spacer{flex:1;min-width:0}
#menus{display:flex;gap:4px}
.menu{position:relative}
.menu>div{position:absolute;top:calc(100% + 4px);left:0;background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:4px;z-index:50;min-width:240px;box-shadow:0 10px 26px #0009;max-height:70vh;overflow:auto}
.menu>div button{display:flex;justify-content:space-between;gap:20px;width:100%;background:none;border:0;text-align:left;padding:5px 8px}
.menu>div button:hover{background:var(--line)}
.menu kbd{font:11px var(--mono);color:var(--mute)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .hd{font-size:11px;color:var(--mute);padding:4px 8px 2px}
.seg{display:flex}
.seg button{border-radius:0}.seg button+button{border-left:0}
.seg button:first-child{border-radius:3px 0 0 3px}.seg button:last-child{border-radius:0 3px 3px 0}
.seg button.on{background:var(--glow);color:#2a2110;border-color:var(--glow)}
#tools{grid-area:tools;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;overflow-y:auto;min-height:0}
#tools button{width:36px;height:32px;flex:none;padding:0;background:none;border:1px solid transparent;display:grid;place-items:center}
#tools button:hover{background:var(--raise)}
#tools button.on{background:var(--glow);color:#2a2110}
#tools svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#tools hr{width:28px;border:0;border-top:1px solid var(--line);margin:3px 0;flex:none}
#stageWrap{grid-area:stage;display:flex;flex-direction:column;min-width:0;min-height:0}
#opts{min-height:34px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:4px 10px;background:var(--desk);border-bottom:1px solid var(--line)}
#opts label{display:flex;align-items:center;gap:5px;color:var(--mute)}
#opts input[type=range]{width:90px}
#opts .tip{color:var(--mute);font-size:12px}
#stageBox{flex:1;position:relative;overflow:hidden;min-height:0;touch-action:none;background:var(--desk)}
#stageBox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#over{cursor:crosshair}
#hud{position:absolute;left:10px;bottom:8px;font:12px var(--mono);color:var(--mute);pointer-events:none}
#insp{grid-area:insp;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
#inspBody{padding:8px 10px 24px;display:flex;flex-direction:column;gap:12px}
.sec>h3{font:700 11px var(--ui);text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:0 0 5px}
.sec{display:flex;flex-direction:column;gap:4px}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) 22px;align-items:center;gap:6px;min-height:25px}
.row>label{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ctl{display:flex;align-items:center;gap:5px;min-width:0}
.row .ctl input:not([type=color]):not([type=checkbox]),.row .ctl select,.row .ctl textarea{width:100%}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;cursor:ew-resize}
.kbtn{width:20px;height:20px;padding:0;background:none;border:0;color:var(--mute);font-size:13px;line-height:1}
.kbtn.has{color:var(--red)}.kbtn.on{color:var(--red);text-shadow:0 0 6px var(--red)}
.btns{display:flex;flex-wrap:wrap;gap:4px}
.list{display:flex;flex-direction:column;max-height:210px;overflow-y:auto;border:1px solid var(--line);border-radius:3px;background:var(--desk)}
.list>div{display:flex;align-items:center;gap:6px;padding:3px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.list>div:hover{background:var(--raise)}
.list>div.on{background:var(--raise);box-shadow:inset 2px 0 var(--glow)}
.list .tag{margin-left:auto;font:11px var(--mono);color:var(--mute)}
.hint{color:var(--mute);font-size:12px;line-height:1.45}
#curve{width:100%;height:150px;background:var(--desk);border:1px solid var(--line);border-radius:3px;touch-action:none;display:block}
#split{grid-area:split;background:var(--line);cursor:ns-resize;touch-action:none}
#tl{grid-area:tl;background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
#cuts{display:flex;gap:4px;padding:5px 8px;overflow-x:auto;background:var(--desk);flex:none;min-height:66px}
.cut{flex:none;position:relative;width:96px;height:54px;border:1px solid var(--line);background:#000;padding:0;overflow:hidden;border-radius:2px}
.cut.on{outline:2px solid var(--glow);outline-offset:0;border-color:var(--glow)}
.cut canvas{width:100%;height:100%;display:block}
.cut span{position:absolute;left:0;right:0;bottom:0;background:#0009;color:#fff;font:10.5px var(--mono);padding:1px 3px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cut.add{background:none;color:var(--mute);width:48px;font-size:18px}
.tmark{flex:none;align-self:center;width:18px;text-align:center;font:11px var(--mono);color:var(--mute);background:none;border:0;padding:0}
#transport{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:none}
#transport .tc{font:500 15px var(--mono);font-variant-numeric:tabular-nums;color:var(--glow);min-width:66px;text-align:center}
#transport .fr{font:12px var(--mono);color:var(--mute);min-width:70px}
#transport label{display:flex;gap:4px;align-items:center;color:var(--mute)}
#tlBody{flex:1;display:flex;min-height:0}
#rows{width:230px;flex:none;overflow:hidden;border-right:1px solid var(--line);padding-top:22px;position:relative}
#rowsIn{will-change:transform}
.r{height:24px;display:flex;align-items:center;gap:3px;padding:0 4px;border-bottom:1px solid #2a2f3d;white-space:nowrap;cursor:pointer;overflow:hidden}
.r.on{background:var(--raise);box-shadow:inset 2px 0 var(--glow)}
.r .nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.r .ty{font:10px var(--mono);color:var(--mute);width:26px;flex:none}
.r .ic{width:18px;height:18px;padding:0;background:none;border:0;color:var(--mute);font-size:11px;flex:none;line-height:1}
.r .ic.off{opacity:.35}
.r.sub{background:#1c202a;color:var(--mute)}
.r.sub.on{color:var(--ink)}
#gridWrap{flex:1;min-width:0;position:relative;overflow:hidden}
#grid{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}
#modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:100;padding:16px;overflow:auto}
#modal[hidden]{display:none}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;max-width:640px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 40px);overflow:auto}
.dlg h2{font:800 22px var(--disp);margin:0;text-wrap:balance}
.dlg p{margin:0;color:var(--mute);line-height:1.55}
.dlg ol{margin:0;padding-left:22px;line-height:1.55;display:flex;flex-direction:column;gap:6px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px 16px;font-size:12px;color:var(--mute)}
.keys kbd{font:11px var(--mono);color:var(--ink);margin-right:5px}
.bar{height:10px;background:var(--desk);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--glow)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--glow);padding:6px 12px;border-radius:4px;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw}
#toast.show{opacity:1}
@media (max-width:900px){
 #app{grid-template:"top" auto "tools" 44px "stage" minmax(0,1fr) "split" 5px "tl" var(--tlh,240px) "insp" 30vh/minmax(0,1fr)}
 #top{flex-wrap:wrap;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
 #tools{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;padding:4px 8px}#tools hr{width:0;height:24px;border-top:0;border-left:1px solid var(--line)}
 #insp{border-left:0;border-top:1px solid var(--line)}
 #rows{width:130px}#projName,#brand .nm{display:none}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
<div id="app">
 <header id="top">
  <div id="brand"><span class="kanji">原画</span><span class="nm">Genga Studio</span></div>
  <input id="projName" aria-label="Project name" spellcheck="false">
  <span id="sampleChip" class="chip" hidden>Sample project</span>
  <nav id="menus"></nav>
  <div class="spacer"></div>
  <div class="seg" id="viewSeg" role="group" aria-label="View"><button id="vCam" title="See exactly what the camera films">Camera</button><button id="vStage" title="See the whole stage and the camera frame">Stage</button></div>
  <button id="btnOnion" class="tog" title="Onion skin: show earlier frames in red and later frames in blue">Onion</button>
  <button id="btnAuto" class="tog rec" title="Auto-key: every change you make records a keyframe at the playhead">Auto-key</button>
  <button id="btnExport" class="primary">Export video</button>
 </header>
 <aside id="tools" aria-label="Tools"></aside>
 <main id="stageWrap">
  <div id="opts"></div>
  <div id="stageBox"><canvas id="comp"></canvas><canvas id="over"></canvas><div id="hud"></div></div>
 </main>
 <aside id="insp"><div id="inspBody"></div></aside>
 <div id="split" title="Drag to resize the timeline"></div>
 <section id="tl">
  <div id="cuts"></div>
  <div id="transport"></div>
  <div id="tlBody">
   <div id="rows"></div>
   <div id="gridWrap"><canvas id="grid"></canvas></div>
  </div>
 </section>
</div>
<input type="file" id="fileAny" multiple hidden>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>'use strict';
/* ---------- basics ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
let _uid=0; const uid=(p='i')=>p+'_'+Date.now().toString(36)+(++_uid).toString(36)+Math.random().toString(36).slice(2,5);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const k in attrs){if(k==='class')e.className=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else if(k==='html')e.innerHTML=attrs[k];else if(attrs[k]!==false&&attrs[k]!=null)e.setAttribute(k,attrs[k]===true?'':attrs[k]);}kids.flat().forEach(c=>c!=null&&e.append(c));return e;};
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;};
const rnd=(seed)=>{const x=Math.sin(seed*127.1+311.7)*43758.5453;return x-Math.floor(x);};
/* 2x3 matrices [a,b,c,d,e,f], same layout as canvas setTransform */
const M={
 id:()=>[1,0,0,1,0,0],
 mul:(m,n)=>[m[0]*n[0]+m[2]*n[1],m[1]*n[0]+m[3]*n[1],m[0]*n[2]+m[2]*n[3],m[1]*n[2]+m[3]*n[3],m[0]*n[4]+m[2]*n[5]+m[4],m[1]*n[4]+m[3]*n[5]+m[5]],
 inv:(m)=>{const d=m[0]*m[3]-m[1]*m[2]||1e-9;return[m[3]/d,-m[1]/d,-m[2]/d,m[0]/d,(m[2]*m[5]-m[3]*m[4])/d,(m[1]*m[4]-m[0]*m[5])/d];},
 ap:(m,x,y)=>[m[0]*x+m[2]*y+m[4],m[1]*x+m[3]*y+m[5]],
 t:(x,y)=>[1,0,0,1,x,y],
 r:(deg)=>{const a=deg*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return[c,s,-s,c,0,0];},
 s:(x,y=x)=>[x,0,0,y,0,0],
 chain:(...ms)=>ms.reduce(M.mul),
 scale:(m)=>Math.hypot(m[0],m[1]),
};
/* cubic-bezier easing */
function bez(e,t){
 const[x1,y1,x2,y2]=e;let lo=0,hi=1,u=t;
 const bx=u=>3*(1-u)*(1-u)*u*x1+3*(1-u)*u*u*x2+u*u*u, by=u=>3*(1-u)*(1-u)*u*y1+3*(1-u)*u*u*y2+u*u*u;
 for(let i=0;i<22;i++){const x=bx(u);if(Math.abs(x-t)<1e-4)break;if(x<t)lo=u;else hi=u;u=(lo+hi)/2;}
 return by(u);
}
const EASES={
 'Linear':null,'Hold':'hold','Ease':[.42,0,.58,1],'Ease in':[.55,0,1,.45],'Ease out':[0,.55,.45,1],
 'Snap':[.05,.9,.1,1],'Anticipate':[.5,-.5,.75,0],'Overshoot':[.2,.9,.3,1.35],
};
/* ---------- keyframe tracks ---------- */
function trackVal(ks,f){
 if(f<=ks[0].f)return ks[0].v;
 const n=ks.length;if(f>=ks[n-1].f)return ks[n-1].v;
 let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(ks[m].f<=f)lo=m;else hi=m;}
 const a=ks[lo],b=ks[hi];if(a.e==='hold')return a.v;
 let t=(f-a.f)/(b.f-a.f);if(Array.isArray(a.e))t=bez(a.e,t);
 if(Array.isArray(a.v)){const o=new Array(a.v.length),bv=b.v;for(let i=0;i<o.length;i++)o[i]=a.v[i]+(bv[i]-a.v[i])*t;return o;}
 return typeof a.v==='number'?a.v+(b.v-a.v)*t:a.v;
}
const hasTrack=(o,p)=>!!(o.tr&&o.tr[p]&&o.tr[p].length);
const val=(o,p,f)=>hasTrack(o,p)?trackVal(o.tr[p],f):o.p[p];
function setKey(o,p,f,v,e){
 if(p==='swap'&&e===undefined)e='hold';
 o.tr=o.tr||{};const t=o.tr[p]=o.tr[p]||[];
 const i=t.findIndex(k=>k.f===f);
 if(i>=0){t[i].v=v;if(e!==undefined)t[i].e=e;return t[i];}
 const k={f,v};if(e!==undefined)k.e=e;t.push(k);t.sort((a,b)=>a.f-b.f);return k;
}
function delKey(o,p,f){const t=o.tr&&o.tr[p];if(!t)return;const i=t.findIndex(k=>k.f===f);if(i>=0)t.splice(i,1);if(!t.length){delete o.tr[p];}}
/* ---------- bitmap + sound stores (immutable, so undo only tracks ids) ---------- */
const Bitmaps=new Map(), Sounds=new Map();
function addBitmap(canvas,id){id=id||uid('a');Bitmaps.set(id,{canvas,w:canvas.width,h:canvas.height});return id;}
/* ---------- document ---------- */
const LAYER_P=()=>({x:0,y:0,rot:0,sx:1,sy:1,ax:0,ay:0,opacity:1,blur:0,bright:1,sat:1,tint:0});
function newLayer(type,name,extra={}){
 return Object.assign({id:uid('l'),name,type,vis:true,lock:false,open:false,blend:'source-over',parallax:1,screen:false,step:1,parent:null,tintColor:'#ffffff',p:LAYER_P(),tr:{}},extra);
}
function newScene(name,dur=72){return{id:uid('s'),name,dur,bg:'#f7f4ee',trans:{type:'cut',dur:12},camera:{id:uid('c'),name:'Camera',p:{x:0,y:0,zoom:1,rot:0,shake:0},tr:{}},layers:[]};}
function newDoc(name='Untitled trailer'){return{v:1,name,w:1920,h:1080,fps:24,scenes:[newScene('Cut 1')],audio:[]};}
const FX={
 gradient:{label:'Sky gradient',p:{top:'#20345e',mid:'#d98a7c',low:'#fbd6a2',midPos:.55}},
 petals:{label:'Sakura petals',p:{count:60,speed:1,size:1,wind:1,opacity:.95,color:'#ffc6d3',seed:1}},
 snow:{label:'Snow',p:{count:150,speed:1,size:1,wind:.3,opacity:.9,color:'#ffffff',seed:2}},
 rain:{label:'Rain',p:{count:220,speed:1,size:1,wind:.2,opacity:.45,color:'#cfe2ff',seed:3}},
 sparkle:{label:'Sparkles',p:{count:50,speed:1,size:1,wind:0,opacity:1,color:'#fff2c4',seed:4}},
 embers:{label:'Embers',p:{count:70,speed:1,size:1,wind:.2,opacity:.9,color:'#ffa24d',seed:5}},
 speedlines:{label:'Speed lines',p:{count:120,inner:.45,opacity:1,color:'#ffffff',cx:.5,cy:.5,seed:6}},
 rays:{label:'Light rays',p:{count:9,opacity:.35,color:'#fff0c8',cx:.8,cy:-.1,spin:.3,seed:7}},
 letterbox:{label:'Letterbox',p:{amount:.11,color:'#000000'}},
 vignette:{label:'Vignette',p:{amount:.55,color:'#050510'}},
 flash:{label:'Flash',p:{amount:0,color:'#ffffff'}},
 grain:{label:'Film grain',p:{amount:.08}},
 grade:{label:'Colour grade',p:{bright:1,contrast:1,sat:1,hue:0,warm:0}},
 bloom:{label:'Bloom glow',p:{amount:.45,radius:24}},
 chroma:{label:'Colour fringe',p:{amount:3}},
 impact:{label:'Impact frame',p:{amount:0,invert:0}},
};
const FX_RANGE={count:[0,400,1],speed:[0,5,.05],size:[.1,5,.05],wind:[-4,4,.05],opacity:[0,1,.01],seed:[0,99,1],inner:[0,1,.01],cx:[-.5,1.5,.01],cy:[-.5,1.5,.01],spin:[-3,3,.05],amount:[0,1,.01],radius:[0,80,1],midPos:[0,1,.01],bright:[0,2,.01],contrast:[0,3,.01],sat:[0,3,.01],hue:[-180,180,1],warm:[-1,1,.01],invert:[0,1,.01]};
FX.chroma.range={amount:[0,30,.5]};

/* ---------- skeleton ---------- */
const BONE_P=()=>({rot:0,x:0,y:0,sx:1,sy:1});
function newBone(name,parent,x,y,rot,len){return{id:uid('b'),name,parent:parent||null,x,y,rot,len,p:BONE_P(),tr:{}};}
function newPart(name,assetId,x,y){const b=Bitmaps.get(assetId);return{id:uid('p'),name,assets:[assetId],x,y,w:b.w,h:b.h,bone:null,mesh:null,density:0,hidden:false,bound:null,p:{opacity:1,swap:0,deform:null},tr:{}};}
/* pose: map bone id -> {m world, skin (pose * inverse rest)}; rest=true gives bind pose */
function rigPose(rig,f,rest,overrides){
 const out={};
